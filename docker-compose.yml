services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webapp:
    build: .
    container_name: debate-webapp
    ports:
      - "8501:8501"
    environment:
      # Pass OpenAI API key from host (optional - for hybrid mode)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      # Local Ollama configuration (fallback)
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - LOCAL_MODEL=${LOCAL_MODEL:-qwen2.5:1.5b}
      # Timeout settings
      - API_TIMEOUT=${API_TIMEOUT:-300.0}
      # Force local mode (skip OpenAI even if key exists)
      - FORCE_LOCAL=${FORCE_LOCAL:-false}
      # Debug settings
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-false}
    volumes:
      # Mount code files for live reload (no rebuild needed)
      - ./app.py:/app/app.py
      - ./agents.py:/app/agents.py
      - ./simulation.py:/app/simulation.py
      - ./collect_experimental_data.py:/app/collect_experimental_data.py
      # Mount .env file if it exists
      - ./.env:/app/.env:ro
      # Mount debate_history directory for persistence and GitHub sync
      - ./debate_history:/app/debate_history
    depends_on:
      ollama:
        condition: service_started
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  ollama_data:
    driver: local
